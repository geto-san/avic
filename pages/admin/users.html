<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Users · AVIC Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/avic.css" />
    <script src="../../assets/js/mock-data.js" defer></script>
    <script src="../../assets/js/session.js" defer></script>
    <script src="../../assets/js/ui.js" defer></script>
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/pages-common.js" defer></script>
    <script src="../../assets/js/pages-admin.js" defer></script>
  </head>
  <body
    data-page="users"
    data-allow="admin"
    data-crumb="Users"
    data-role="admin"
  >
    <noscript
      ><div class="noscript">
        This prototype renders its screens with JavaScript. Enable it to walk
        through the portal.
      </div></noscript
    >
    <div class="shell">
      <div class="main">
        <main class="page">
          <div class="page__head">
            <div>
              <h1>Users</h1>
              <div class="sub">
                Approve new accounts, change access, or step into a claimant's
                view.
              </div>
            </div>
            <div class="page__actions">
              <button class="btn btn--primary" data-stub="Invite a user">
                Invite a user
              </button>
            </div>
          </div>
          <div class="panel">
            <div class="filters">
              <input
                type="search"
                id="f-q"
                placeholder="Search name or email"
                aria-label="Search users"
              />
              <select id="f-role" aria-label="Filter by role">
                <option value="">All roles</option>
                <option value="claimant">Claimant</option>
                <option value="adjuster">Adjuster</option>
                <option value="garage">Garage</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
            <div id="users-table"></div>
          </div>
          <div class="future">
            <span class="future__tag">Future prospect</span>
            <h3>Granular permissions</h3>
            <p>
              Per-permission roles instead of four fixed ones, so a senior
              adjuster can release payouts without full administration rights.
            </p>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
