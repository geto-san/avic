<link rel="canonical" href="https://avic.example.com/pages/auth/login.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AVIC">
<meta property="og:title" content="Sign in · AVIC">
<meta property="og:description" content="Sign in to AVIC to file an auto insurance claim, track a claim's status, or manage the repair estimates and payouts tied to it.">
<meta property="og:url" content="https://avic.example.com/pages/auth/login.html">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Sign in · AVIC">
<meta name="twitter:description" content="Sign in to AVIC to file an auto insurance claim, track a claim's status, or manage the repair estimates and payouts tied to it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body data-page="login">

<div class="auth">
  <aside class="auth__aside">
    <div class="auth__brand">
      <div class="rail__mark">AV</div>
      <div>
        <div class="rail__brandname">AVIC</div>
        <div class="rail__brandsub">Auto vehicle insurance claims</div>
      </div>
    </div>

    <h1>File it once. Follow it all the way to the payout.</h1>

    <div class="flow">
      <p> Developed by Team AVIC</p>
    </div>
  </aside>

  <main class="auth__main">
    <div class="authcard">
      <div id="reason"></div>

      <div class="panel">
        <div class="panel__head"><h2>Sign in</h2></div>
        <div class="panel__body">
          <form id="login-form" autocomplete="off">
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="name@example.com" data-required>
              <div class="err">Enter the email on your account.</div>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="••••••••" data-required>
              <div class="err">Enter your password.</div>
            </div>
            <div class="check">
              <input type="checkbox" id="remember" name="remember">
              <label for="remember">Keep me signed in on this device</label>
            </div>
            <button class="btn btn--primary btn--block" type="submit">Sign in</button>
          </form>
        </div>
        <div class="panel__foot">
          <a href="forgot-password.html">Forgotten your password?</a>
          <div style="flex:1"></div>
          <a href="register.html">Create an account</a>
        </div>
      </div>
    </div>
  </main>
</div>

</body>
</html>
