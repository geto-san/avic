<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Audit log · AVIC Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/avic.css" />
    <script src="../../assets/js/mock-data.js" defer></script>
    <script src="../../assets/js/session.js" defer></script>
    <script src="../../assets/js/ui.js" defer></script>
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/pages-common.js" defer></script>
    <script src="../../assets/js/pages-admin.js" defer></script>
  </head>
  <body
    data-page="audit-log"
    data-allow="admin"
    data-crumb="Audit log"
    data-role="admin"
  >
    <noscript
      ><div class="noscript">
        This prototype renders its screens with JavaScript. Enable it to walk
        through the portal.
      </div></noscript
    >
    <div class="shell">
      <div class="main">
        <main class="page">
          <div class="page__head">
            <div>
              <h1>Audit log</h1>
              <div class="sub">Who did what, and from where.</div>
            </div>
          </div>
          <div class="panel">
            <div class="filters">
              <input
                type="search"
                id="f-q"
                placeholder="Search action, person or entity"
                aria-label="Search the audit log"
              />
              <select id="f-action" aria-label="Filter by action group">
                <option value="">All actions</option>
                <option value="claim.">Claims</option>
                <option value="document.">Documents</option>
                <option value="estimate.">Estimates</option>
                <option value="payout.">Payouts</option>
                <option value="user.">Users</option>
                <option value="auth.">Sign-ins</option>
              </select>
            </div>
            <div id="audit-table"></div>
          </div>
          <div class="future">
            <span class="future__tag">Future prospect</span>
            <h3>Retention and privacy controls</h3>
            <p>
              Automatic anonymising of resolved claims past their retention
              window, plus handling of data deletion requests.
            </p>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
