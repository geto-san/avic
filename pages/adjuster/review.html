<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<title>Claim review · AVIC</title>
<link rel="stylesheet" href="../../assets/css/avic.css">
<script src="../../assets/js/data-store.js" defer></script>
<script src="../../assets/js/session.js" defer></script>
<script src="../../assets/js/api.js" defer></script>
<script src="../../assets/js/ui.js" defer></script>
<script src="../../assets/js/layout.js" defer></script>
<script src="../../assets/js/pages-common.js" defer></script>
<script src="../../assets/js/pages-adjuster.js" defer></script>
</head>
<body data-title="Review claim" data-page="review" data-allow="adjuster" data-role="adjuster">
<noscript><div class="noscript">Enable JavaScript to use this application.</div></noscript>
<div class="shell">
  <div class="main">
    <main class="page">

        <div class="filters"><div id="claim-status-actions" class="btnrow" aria-label="Claim lifecycle"></div><div class="page__actions"><span id="c-badge"></span> <span id="c-sla"></span></div></div>

      <div class="review">
        <div>
          <div class="panel">
            <div class="panel__head"><h2>The claim</h2></div>
            <div class="panel__body" id="c-facts"></div>
          </div>
          <div class="panel">
            <div class="panel__head"><h2>Cover checks</h2><div class="spacer"></div>
              <span class="small muted">Run against the policy on file</span></div>
            <div id="c-checks"></div>
          </div>
          <div class="panel">
            <div class="panel__head"><h2>Garage estimate</h2></div>
            <div class="panel__body" id="c-estimate"></div>
          </div>

          <div class="panel">
            <div class="panel__head"><h2>Payout</h2></div>
            <div class="panel__body" id="c-payout"></div>
          </div>
        </div>

        <div>
          <div class="panel">
            <div class="panel__head"><h2>Documents</h2><div class="spacer"></div>
              <span class="small muted" id="doc-summary"></span></div>
            <div class="panel__body">
              <div class="viewer">
                <div class="viewer__bar"><span id="v-name"></span><span class="spacer"></span><span id="v-verify"></span></div>
                <div class="viewer__stage" id="stage"></div>
                <div class="thumbs" id="thumbs"></div>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel__head"><h2>Your decision</h2></div>
            <div class="panel__body">
              <form id="decision">
                <input type="hidden" name="decision">
                <div class="choices" style="margin-bottom:16px">
                  <button type="button" class="choice" aria-pressed="false" data-decision="approve"><span class="choice__t">Approve</span><span class="choice__d">Settle at an amount you set</span></button>
                  <button type="button" class="choice" aria-pressed="false" data-decision="reject"><span class="choice__t">Reject</span><span class="choice__d">Not payable under the policy</span></button>
                  <button type="button" class="choice" aria-pressed="false" data-decision="request_docs"><span class="choice__t">Ask for documents</span><span class="choice__d">Send it back to the claimant</span></button>
                </div>
                <section id="document-request-fields" hidden>
                  <h3>Documents needed</h3><p class="muted">Choose each document, or select Other and enter its name.</p>
                  <div id="document-request-rows"></div>
                  <button class="btn" id="add-document-request" type="button">Add another document</button>
                </section>
                <div class="field hidden" id="amount-field">
                  <label for="recommended_amount">Amount to approve (UGX)</label>
                  <input type="number" min="0" step="1000" id="recommended_amount" name="recommended_amount">
                  <div class="hint" id="limit-note"></div>
                  <div class="err" id="amount-err"></div>
                </div>
                <div class="field">
                  <label for="review_notes">Decision reason / document request <span class="counter" id="note-count"></span></label>
                  <textarea id="review_notes" name="review_notes" maxlength="500" data-counter data-counter-target="#note-count"
                    placeholder="What you checked and why you landed on this decision."></textarea>
                  <div class="hint">Rejection reasons and document requests are shown to the claimant. Approval notes stay internal.</div>
                </div>
                <div class="btnrow">
                  <button class="btn btn--primary" type="submit">Record decision</button>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
