<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile · AVIC Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../assets/css/avic.css" />
    <script src="../../assets/js/mock-data.js" defer></script>
    <script src="../../assets/js/session.js" defer></script>
    <script src="../../assets/js/ui.js" defer></script>
    <script src="../../assets/js/layout.js" defer></script>
    <script src="../../assets/js/pages-common.js" defer></script>
    <script src="../../assets/js/pages-garage.js" defer></script>
  </head>
  <body
    data-page="profile"
    data-allow="garage"
    data-crumb="Profile"
    data-role="garage"
  >
    <noscript
      ><div class="noscript">
        This prototype renders its screens with JavaScript. Enable it to walk
        through the portal.
      </div></noscript
    >
    <div class="shell">
      <div class="main">
        <main class="page">
          <div class="page__head">
            <div>
              <h1>Profile</h1>
              <div class="sub">Your account details and how we reach you.</div>
            </div>
          </div>
          <div class="grid grid--wide">
            <div class="panel">
              <div class="panel__head"><h2>Details</h2></div>
              <div class="panel__body">
                <form id="profile-form">
                  <div class="field">
                    <label for="full_name">Full name</label>
                    <input
                      type="text"
                      id="full_name"
                      name="full_name"
                      data-required
                    />
                    <div class="err">A name is required.</div>
                  </div>
                  <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" data-required />
                    <div class="err">A valid email is required.</div>
                  </div>
                  <div class="field">
                    <label for="phone">Phone</label>
                    <input
                      type="tel"
                      id="phone"
                      name="phone"
                      placeholder="+256 …"
                    />
                  </div>
                  <div class="btnrow">
                    <button class="btn btn--primary" type="submit">
                      Save changes
                    </button>
                    <button
                      class="btn"
                      type="button"
                      data-stub="Password change"
                    >
                      Change password
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div>
              <div class="panel">
                <div class="panel__head"><h2>Account</h2></div>
                <div class="panel__body">
                  <dl class="kv">
                    <dt>Role</dt>
                    <dd id="p-role"></dd>
                    <dt>Account id</dt>
                    <dd class="mono" id="p-uuid"></dd>
                    <dt>Member since</dt>
                    <dd id="p-since"></dd>
                    <dt>Last sign-in</dt>
                    <dd id="p-last"></dd>
                  </dl>
                </div>
              </div>
              <div class="future">
                <span class="future__tag">Future prospect</span>
                <h3>Two-step sign-in</h3>
                <p>
                  An authenticator code on top of your password, required for
                  adjuster and administrator accounts.
                </p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
