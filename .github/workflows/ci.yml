name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: composer.json is valid
        run: composer validate --strict

      - name: PHP syntax
        run: php bin/lint.php

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    # The baseline migration uses MariaDB's utf8mb4_uca1400_ai_ci (11.3+), so test on 11.4.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-only-for-ci
          MARIADB_DATABASE: avic_test
          MARIADB_USER: avic
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      AVIC_TEST_DB_HOST: 127.0.0.1
      AVIC_TEST_DB_PORT: 3306
      AVIC_TEST_DB_NAME: avic_test
      AVIC_TEST_DB_USER: avic
      AVIC_TEST_DB_PASS: ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, curl, dom, xml
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Migrations apply to an empty database, and again as a no-op
        env:
          AVIC_DB_HOST: 127.0.0.1
          AVIC_DB_PORT: 3306
          AVIC_DB_NAME: avic_test
          AVIC_DB_USER: avic
          AVIC_DB_PASS: ci-only-password
        run: |
          php bin/migrate.php
          php bin/migrate.php --status
          php bin/migrate.php

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Feature tests
        run: vendor/bin/phpunit --testsuite feature

  browser:
    name: Desktop and mobile workflows
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-only-for-ci
          MARIADB_DATABASE: avic_browser
          MARIADB_USER: avic
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AVIC_DB_HOST: 127.0.0.1
      AVIC_DB_PORT: 3306
      AVIC_DB_NAME: avic_browser
      AVIC_DB_USER: avic
      AVIC_DB_PASS: ci-only-password
      AVIC_UPLOAD_DIR: /tmp/avic-browser-uploads
      AVIC_ALLOW_INSECURE_COOKIES: '1'
      AVIC_PUBLIC_URL: http://127.0.0.1:8080
      AVIC_BROWSER_MAIL_FILE: /tmp/avic-browser-mail.eml
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, fileinfo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed and start isolated application
        run: |
          php config/db/seed-demo.php
          umask 077
          touch "$AVIC_BROWSER_MAIL_FILE"
          php -d "sendmail_path=/bin/cat >> $AVIC_BROWSER_MAIL_FILE" -S 127.0.0.1:8080 bin/serve-router.php > /tmp/avic-browser-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/config/api/health.php; then exit 0; fi
            sleep 1
          done
          cat /tmp/avic-browser-server.log
          exit 1
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
