<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<title>Adjuster dashboard · AVIC</title>
<link rel="stylesheet" href="../../assets/css/avic.css">
<script src="../../assets/js/data-store.js" defer></script>
<script src="../../assets/js/session.js" defer></script>
<script src="../../assets/js/api.js" defer></script>
<script src="../../assets/js/ui.js" defer></script>
<script src="../../assets/js/layout.js" defer></script>
<script src="../../assets/js/pages-common.js" defer></script>
<script src="../../assets/js/pages-adjuster.js" defer></script>
</head>
<body data-title="Dashboard" data-page="dashboard" data-allow="adjuster" data-role="adjuster">
<noscript><div class="noscript">Enable JavaScript to use this application.</div></noscript>
<div class="shell">
  <div class="main">
    <main class="page">

      <div class="ledger">
        <div class="ledger__cell"><div class="ledger__k">Open claims</div><div class="ledger__v" id="k-open">0</div><div class="ledger__n">assigned to you</div></div>
        <div class="ledger__cell"><div class="ledger__k">Past deadline</div><div class="ledger__v" id="k-late">0</div><div class="ledger__n">breaching the 14-day service level</div></div>
        <div class="ledger__cell"><div class="ledger__k">Decided</div><div class="ledger__v" id="k-decided">0</div><div class="ledger__n">approved, rejected or paid</div></div>
        <div class="ledger__cell"><div class="ledger__k">Open exposure</div><div class="ledger__v" id="k-exposure">0</div><div class="ledger__n">claimed, not yet decided</div></div>
      </div>

      <div class="grid grid--wide">
        <div class="panel">
          <div class="panel__head"><h2>Next up</h2><div class="spacer"></div><a class="btn btn--sm" href="queue.html">Full queue</a></div>
          <div id="next-up"></div>
        </div>
        <div>
          <div class="panel">
            <div class="panel__head"><h2>Your caseload by status</h2></div>
            <div class="panel__body" id="mix"></div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>
</body>
</html>
