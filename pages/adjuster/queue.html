<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<title>Review queue · AVIC</title>
<link rel="stylesheet" href="../../assets/css/avic.css">
<script src="../../assets/js/data-store.js" defer></script>
<script src="../../assets/js/session.js" defer></script>
<script src="../../assets/js/api.js" defer></script>
<script src="../../assets/js/ui.js" defer></script>
<script src="../../assets/js/layout.js" defer></script>
<script src="../../assets/js/pages-common.js" defer></script>
<script src="../../assets/js/pages-adjuster.js" defer></script>
</head>
<body data-title="Review queue" data-page="queue" data-allow="adjuster" data-role="adjuster">
<noscript><div class="noscript">Enable JavaScript to use this application.</div></noscript>
<div class="shell">
  <div class="main">
    <main class="page">

      <div class="panel">
        <div class="filters">
          <input type="search" id="f-q" placeholder="Search claim number or place" aria-label="Search the queue">
          <select id="f-status" aria-label="Filter by status">
            <option value="">Any status</option>
            <option value="submitted">Submitted</option>
            <option value="under_review">Under review</option>
            <option value="pending_docs">Documents needed</option>
          </select>
        </div>
        <div id="queue-table"></div>
      </div>

      <section class="panel" aria-labelledby="coverage-heading">
        <div class="panel__head"><h2 id="coverage-heading">Coverage verification</h2></div>
        <div class="panel__body" id="coverage-tasks" aria-live="polite"></div>
        <button type="button" class="btn" id="more-coverage" hidden>Load more tasks</button>
      </section>
    </main>
  </div>
</div>
</body>
</html>
